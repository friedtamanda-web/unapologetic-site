<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="The Human Cost of Competence. A loop: you are capable, so you are handed more, you carry it well, so you are trusted with even more. The loop tightens until you are the one holding everything. Being good at carrying is not the same as being free.">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=Archivo+Narrow:wght@700&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .disp{font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:700;text-transform:uppercase}
      .sans{font-family:"Archivo",system-ui,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
      .ink{fill:#0e0e11}.soft{fill:#3c3c44}.gray{fill:#73737d}.pink{fill:#ff2d83}.pinkd{fill:#e2186e}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff2d83"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="64" y="64" class="mono pinkd" font-size="13">The Unapologetic Leader · Framework</text>
  <text x="64" y="112" class="disp ink" font-size="40">The human cost of <tspan class="pink">competence.</tspan></text>
  <rect x="64" y="132" width="48" height="4" fill="#ff2d83"/>

  <!-- loop arrows (clockwise) around center -->
  <g fill="none" stroke="#ff2d83" stroke-width="2.5">
    <path d="M360 250 C 540 210, 600 210, 690 268" marker-end="url(#ah)"/>
    <path d="M760 330 C 800 420, 760 470, 690 512" marker-end="url(#ah)"/>
    <path d="M600 540 C 480 575, 420 565, 320 520" marker-end="url(#ah)"/>
    <path d="M250 460 C 200 380, 220 320, 290 282" marker-end="url(#ah)"/>
  </g>

  <!-- center -->
  <text x="480" y="388" text-anchor="middle" class="disp gray" font-size="15">The loop tightens</text>

  <!-- nodes -->
  <!-- top-left -->
  <g><rect x="150" y="222" width="210" height="62" rx="10" fill="#0e0e11"/>
     <text x="255" y="250" text-anchor="middle" class="mono pink" font-size="11">01</text>
     <text x="255" y="272" text-anchor="middle" class="sans" fill="#ffffff" font-size="17">You're capable</text></g>
  <!-- top-right -->
  <g><rect x="640" y="222" width="230" height="62" rx="10" fill="#f7f7f9" stroke="#e8e8ec"/>
     <text x="755" y="250" text-anchor="middle" class="mono pinkd" font-size="11">02</text>
     <text x="755" y="272" text-anchor="middle" class="sans ink" font-size="17">So you're handed more</text></g>
  <!-- bottom-right -->
  <g><rect x="640" y="500" width="230" height="62" rx="10" fill="#f7f7f9" stroke="#e8e8ec"/>
     <text x="755" y="528" text-anchor="middle" class="mono pinkd" font-size="11">03</text>
     <text x="755" y="550" text-anchor="middle" class="sans ink" font-size="17">You carry it well</text></g>
  <!-- bottom-left -->
  <g><rect x="140" y="500" width="230" height="62" rx="10" fill="#f7f7f9" stroke="#e8e8ec"/>
     <text x="255" y="528" text-anchor="middle" class="mono pinkd" font-size="11">04</text>
     <text x="255" y="550" text-anchor="middle" class="sans ink" font-size="17">Trusted with even more</text></g>

  <line x1="64" y1="600" x2="896" y2="600" stroke="#e8e8ec" stroke-width="2"/>
  <text x="64" y="630" class="sans soft" font-size="16">Being good at carrying is not the same as being free.</text>
</svg>
