<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Village</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F3ECDA;--paper:#fffdf7;--green:#2F4A3A;--green-soft:#46624f;--gold:#C9982A;--line:#e3dcc6;--ink:#2a2a22}
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased}
  body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;line-height:1.6}
  /* GATE */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;max-width:440px;width:100%;padding:40px 34px;text-align:center;box-shadow:0 24px 60px rgba(47,74,58,.14)}
  .crest{width:54px;height:54px;margin:0 auto 18px;display:block}
  .card .eb{font-family:"Archivo",sans-serif;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .card h1{font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:700;text-transform:uppercase;font-size:2rem;color:var(--green);margin:10px 0 6px;letter-spacing:.02em}
  .card p.sub{color:var(--green-soft);font-size:.98rem;margin-bottom:22px}
  .card input{width:100%;font-family:inherit;font-size:1rem;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-align:center}
  .card input:focus{outline:none;border-color:var(--gold)}
  .card button{margin-top:14px;width:100%;font-family:inherit;font-weight:600;font-size:1rem;background:var(--green);color:#fff;border:none;border-radius:10px;padding:13px;cursor:pointer;transition:background .25s}
  .card button:hover{background:#23382c}
  #err{color:#b23b3b;font-size:.86rem;margin-top:12px;min-height:1.1em}
  /* CONTENT */
  #content{display:none;max-width:760px;margin:0 auto;padding:64px 26px 100px}
  #content h1{font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(2.1rem,5vw,3rem);color:var(--green);line-height:1.02;margin:36px 0 6px}
  #content h2{font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:700;text-transform:uppercase;font-size:1.5rem;color:var(--green);margin:38px 0 8px;border-bottom:2px solid var(--gold);padding-bottom:6px;display:inline-block}
  #content h3{font-family:"Archivo",sans-serif;font-weight:700;font-size:1.18rem;color:var(--green-soft);margin:26px 0 6px}
  #content h4,#content h5{font-family:"Archivo",sans-serif;font-weight:600;color:var(--green-soft);margin:18px 0 4px}
  #content p{margin:10px 0;font-size:1.05rem}
  #content em{font-family:"Newsreader",Georgia,serif;font-style:italic;color:var(--green-soft)}
  #content strong{color:var(--green)}
  #content ul{margin:10px 0 10px 22px} #content li{margin:5px 0}
  #content blockquote{border-left:3px solid var(--gold);padding:6px 0 6px 18px;margin:16px 0;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:1.15rem;color:var(--green)}
  #content hr{border:none;border-top:1px solid var(--line);margin:34px 0}
  .vfoot{text-align:center;color:var(--green-soft);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;padding:30px 0 60px}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <svg class="crest" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="#2F4A3A" stroke-width="4"/><circle cx="50" cy="50" r="33" fill="none" stroke="#C9982A" stroke-width="3"/><polygon points="50,28 36,55 64,55" fill="#2F4A3A"/><polygon points="50,40 38,62 62,62" fill="#2F4A3A"/><rect x="47" y="62" width="6" height="12" fill="#8a6a3a"/></svg>
    <div class="eb">The Village</div>
    <h1>You found it.</h1>
    <p class="sub">This one's locked. Enter the password to come in.</p>
    <form id="f"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Unlock</button></form>
    <div id="err"></div>
  </div>
</div>
<div id="content"></div>

function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function unlock(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit",async function(ev){
  ev.preventDefault();
  const err=document.getElementById("err"); err.textContent="";
  try{
    const html=await unlock(document.getElementById("pw").value);
    document.getElementById("content").innerHTML=html;
    document.getElementById("gate").style.display="none";
    document.getElementById("content").style.display="block";
    document.getElementById("vfoot").style.display="block";
    window.scrollTo(0,0);
  }catch(e){ err.textContent="That's not it. Try again."; }
});
