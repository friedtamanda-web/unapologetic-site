<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#E4D6B6;-webkit-font-smoothing:antialiased;background-image:radial-gradient(rgba(120,100,60,.10) 1px,transparent 1px);background-size:5px 5px}
  @keyframes vpulse{0%,100%{opacity:1}50%{opacity:.5}}
  image-slot{display:block;width:100%;height:180px}
  @media print{
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}

<style>
  #vgate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Source Sans 3',sans-serif}
  #vgate .card{background:#2F4A3A;color:#F3ECDA;max-width:430px;width:100%;padding:14px;box-shadow:0 8px 30px rgba(20,30,15,.4)}
  #vgate .inner{border:1.5px solid rgba(243,236,218,.45);outline:4px solid #2F4A3A;outline-offset:-9px;padding:34px 26px;text-align:center}
  #vgate .eb{font:700 10px/1.4 'Source Sans 3',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#C9982A}
  #vgate h1{font:800 30px/1 'Playfair Display',serif;color:#F3ECDA;margin:10px 0 6px}
  #vgate p{color:#cfc4a5;font-size:.95rem;margin-bottom:20px;font-family:'Libre Baskerville',serif;font-style:italic}
  #vgate input{width:100%;font:1rem 'Source Sans 3',sans-serif;padding:13px 15px;border:1px solid #C9982A;border-radius:4px;background:#26402F;color:#F3ECDA;text-align:center}
  #vgate input::placeholder{color:#9fb0a0}
  #vgate button{margin-top:12px;width:100%;font:700 .82rem/1 'Source Sans 3',sans-serif;letter-spacing:.18em;text-transform:uppercase;background:#C9982A;color:#2F4A3A;border:none;border-radius:4px;padding:14px;cursor:pointer}
  #vgate button:hover{background:#dCAF3e}
  #verr{color:#f3b0a0;font-size:.84rem;margin-top:12px;min-height:1.1em;font-family:'Source Sans 3',sans-serif;font-style:normal}
  #vcontent{display:none}
</style>

/* WCAG AA contrast pass */
.eyebrow,.kicker,.sec-kicker{color:#b81c66!important}
.btn-primary,.nav-cta:hover,.ulc-yes,.gumroad-button{background:#b81c66!important;color:#fff!important}
.btn-primary:hover{background:#1A1614!important}
/* fix dark-on-dark: btn-text + step numbers inside dark sections were ink-on-ink */
.dark .btn-text,.sec.dark .btn-text{color:#F4EEE6!important}
.dark .n,.sec.dark .n,.dark .qn,.sec.dark .qn{color:#E84393!important}
/* keep bright pink on dark sections (passes AA) */
.dark .eyebrow,.sec.dark .eyebrow,.dark .kicker,.sec.dark .kicker{color:#E84393!important}
/* links not by color alone */
.prose a,article a,.lede a,p a:not(.btn):not(.btn-text):not(.btn-primary){text-decoration:underline;text-underline-offset:2px}
</style>

function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById("vf").addEventListener("submit",async function(ev){
  ev.preventDefault(); const err=document.getElementById("verr"); err.textContent="";
  try{
    const html=await unlock(document.getElementById("vpw").value);
    document.getElementById("vcontent").innerHTML=html;
    document.getElementById("vgate").style.display="none";
    document.getElementById("vcontent").style.display="block";
    window.scrollTo(0,0);
  }catch(e){ err.textContent="That's not it. Try again."; }
});
